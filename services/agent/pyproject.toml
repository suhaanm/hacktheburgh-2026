[project]
name = "understudy-agent"
version = "0.1.0"
description = "Understudy agent service: supervisor, orchestrator, tiers, security, queue, off-hours."
requires-python = ">=3.12"
dependencies = [
  "understudy-engine",
  "understudy-clicky-lift",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "playwright>=1.47",
  "openai>=1.50",
  "pyyaml>=6",
  "jsonschema>=4.22",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "orjson>=3.10",
  "pillow>=10",
  "mcp==2.3.0",
  # the real desktop actuator (clicks, typing, window list, accessibility reads) on a Mac; the engine and the tests never import these
  "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
  "pyobjc-framework-ApplicationServices>=10; sys_platform == 'darwin'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["understudy_agent"]
