<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estimate - Turn2Us-style Quick Estimator</title><style>body{font:15px Georgia,serif;margin:0;background:#f4f1ea;color:#222}header{background:#6b2c6b;color:#fff;padding:14px 20px}main{max-width:760px;margin:20px auto;padding:0 16px}form{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}label{font-weight:600}input,select{padding:6px;width:100%}.full{grid-column:1/3}button{background:#6b2c6b;color:#fff;border:0;padding:12px 22px;font-size:16px;cursor:pointer}</style></head><body><header><strong>Turn2Us-style Quick Estimator</strong></header><main><h1>Quick benefits estimate</h1><p>No sign-in. Nothing is stored.</p><form method="post" action="/calculate"><label for="adults">Adults in household</label><select id="adults" name="adults"><option value="1">Just me</option><option value="2">Me and a partner</option></select><label for="age">Your age</label><input id="age" name="age" type="number" autocomplete="off"><label for="partner_age">Partner&#x27;s age (if any)</label><input id="partner_age" name="partner_age" type="number" autocomplete="off"><label for="kids">Children&#x27;s ages (e.g. 3, 7)</label><input id="kids" name="kids" type="text" autocomplete="off"><label for="pay">Your monthly pay after tax (£)</label><input id="pay" name="pay" type="text" autocomplete="off"><label for="partner_pay">Partner&#x27;s monthly pay after tax (£)</label><input id="partner_pay" name="partner_pay" type="text" autocomplete="off"><label for="health">Health condition limiting work?</label><select id="health" name="health"><option value="no">No</option><option value="yes">Yes</option></select><label for="home">Rent or own?</label><select id="home" name="home"><option value="rent">Rent</option><option value="own">Own</option></select><label for="rent">Monthly rent (£)</label><input id="rent" name="rent" type="text" autocomplete="off"><label for="bedrooms">Bedrooms needed</label><select id="bedrooms" name="bedrooms"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select><label for="savings">Savings (£)</label><input id="savings" name="savings" type="text" autocomplete="off"><label for="childcare">Monthly childcare (£)</label><input id="childcare" name="childcare" type="text" autocomplete="off"><button id="calculate" type="submit" class="full">Calculate</button></form></main></body></html>
