<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculator - EntitledTo-style Calculator</title><style>body{font:15px 'Helvetica Neue',sans-serif;margin:0;background:#eef6f3;color:#12332b}header{background:#0d6b57;color:#fff;padding:14px 22px}main{max-width:700px;margin:18px auto;padding:0 16px}.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs span{padding:6px 14px;background:#cfe7df;border-radius:6px 6px 0 0}.tabs .on{background:#fff;font-weight:700}fieldset{background:#fff;border:1px solid #bcd;padding:14px}label{display:block;margin:10px 0 3px}input,select{padding:6px;min-width:200px}button{display:block;background:#0d6b57;color:#fff;border:0;padding:9px 16px;margin-top:14px;cursor:pointer}table{background:#fff;border-collapse:collapse;width:100%}td,th{border:1px solid #bcd;padding:8px;text-align:left}</style></head><body><header><strong>EntitledTo-style Calculator</strong></header><main><h1>Benefit entitlement calculator</h1><div class="tabs"><span class="on" id="tab1">1. About you</span><span id="tab2">2. Your money</span></div><form method="post" action="/results?layout=v2"><fieldset id="panel1"><legend>About your household</legend><label for="x-adults-count">Adults</label><select id="x-adults-count" name="x-adults-count" data-testid="x-adults-count"><option value="1">One adult</option><option value="2">Two adults</option></select><label for="x-age-1">Age of first adult</label><input id="x-age-1" name="x-age-1" type="number" autocomplete="off" data-testid="x-age-1"><label for="x-age-2">Age of second adult</label><input id="x-age-2" name="x-age-2" type="number" autocomplete="off" data-testid="x-age-2"><label for="x-kids">Children&#x27;s ages, comma separated</label><input id="x-kids" name="x-kids" type="text" autocomplete="off" data-testid="x-kids"><button type="button" data-testid="x-next-tab" id="to-money">Continue to finances</button></fieldset><fieldset id="panel2" hidden><legend>Your income, housing and savings</legend><label for="x-earn-1-annual">First adult: earnings per YEAR after tax (£)</label><input id="x-earn-1-annual" name="x-earn-1-annual" type="text" autocomplete="off" data-testid="x-earn-1-annual"><label for="x-earn-2-annual">Second adult: earnings per YEAR after tax (£)</label><input id="x-earn-2-annual" name="x-earn-2-annual" type="text" autocomplete="off" data-testid="x-earn-2-annual"><label for="x-health-limits">Limited capability for work?</label><select id="x-health-limits" name="x-health-limits" data-testid="x-health-limits"><option value="no">No</option><option value="yes">Yes</option></select><label for="x-tenure">Housing</label><select id="x-tenure" name="x-tenure" data-testid="x-tenure"><option value="rent">Renting</option><option value="own">Owner occupier</option></select><label for="x-rent-weekly">Rent per WEEK (£)</label><input id="x-rent-weekly" name="x-rent-weekly" type="text" autocomplete="off" data-testid="x-rent-weekly"><label for="x-bedrooms">Bedrooms</label><select id="x-bedrooms" name="x-bedrooms" data-testid="x-bedrooms"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select><label for="x-savings">Savings (£)</label><input id="x-savings" name="x-savings" type="text" autocomplete="off" data-testid="x-savings"><label for="x-childcare-weekly">Childcare per WEEK (£)</label><input id="x-childcare-weekly" name="x-childcare-weekly" type="text" autocomplete="off" data-testid="x-childcare-weekly"><button type="submit" data-testid="x-show-results">See entitlement</button></fieldset></form><script>document.getElementById('to-money').addEventListener('click',function(){var ok=document.getElementById('panel1').checkValidity();if(!ok){document.getElementById('panel1').reportValidity();return;}document.getElementById('panel1').hidden=true;document.getElementById('panel2').hidden=false;document.getElementById('tab1').className='';document.getElementById('tab2').className='on';});</script></main></body></html>
