<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estimate - Turn2Us-style Quick Estimator</title><style>body{font:15px Georgia,serif;margin:0;background:#f4f1ea;color:#222}header{background:#6b2c6b;color:#fff;padding:14px 20px}main{max-width:760px;margin:20px auto;padding:0 16px}form{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}label{font-weight:600}input,select{padding:6px;width:100%}.full{grid-column:1/3}button{background:#6b2c6b;color:#fff;border:0;padding:12px 22px;font-size:16px;cursor:pointer}</style></head><body><header><strong>Turn2Us-style Quick Estimator</strong></header><main><h1>Quick benefits estimate</h1><p>No sign-in. Nothing is stored.</p><form method="post" action="/calculate?layout=v2"><label for="f_adults">Adults in household</label><select id="f_adults" name="f_adults"><option value="1">Just me</option><option value="2">Me and a partner</option></select><label for="f_age">Your age</label><input id="f_age" name="f_age" type="number" autocomplete="off"><label for="f_partner_age">Partner&#x27;s age (if any)</label><input id="f_partner_age" name="f_partner_age" type="number" autocomplete="off"><label for="f_kids">Children&#x27;s ages (e.g. 3, 7)</label><input id="f_kids" name="f_kids" type="text" autocomplete="off"><label for="f_pay">Your monthly pay after tax (£)</label><input id="f_pay" name="f_pay" type="text" autocomplete="off"><label for="f_partner_pay">Partner&#x27;s monthly pay after tax (£)</label><input id="f_partner_pay" name="f_partner_pay" type="text" autocomplete="off"><label for="f_health">Health condition limiting work?</label><select id="f_health" name="f_health"><option value="no">No</option><option value="yes">Yes</option></select><label for="f_home">Rent or own?</label><select id="f_home" name="f_home"><option value="rent">Rent</option><option value="own">Own</option></select><label for="f_rent">Monthly rent (£)</label><input id="f_rent" name="f_rent" type="text" autocomplete="off"><label for="f_bedrooms">Bedrooms needed</label><select id="f_bedrooms" name="f_bedrooms"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select><label for="f_savings">Savings (£)</label><input id="f_savings" name="f_savings" type="text" autocomplete="off"><label for="f_childcare">Monthly childcare (£)</label><input id="f_childcare" name="f_childcare" type="text" autocomplete="off"><button id="submit-estimate" type="submit" class="full">Get my estimate</button></form></main></body></html>
