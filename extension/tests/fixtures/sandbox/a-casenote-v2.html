<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Case note - GovCalc Benefits Checker</title><style>body{font:16px/1.5 Arial,sans-serif;margin:0;color:#0b0c0c}header{background:#0b0c0c;color:#fff;padding:12px 24px;border-bottom:10px solid #1d70b8}main{max-width:640px;margin:24px auto;padding:0 16px}label{display:block;font-weight:700;margin:16px 0 4px}input,select{font:inherit;padding:6px;min-width:220px}button{background:#00703c;color:#fff;font:inherit;border:0;padding:10px 18px;margin-top:20px;cursor:pointer}</style></head><body><header><strong>GovCalc Benefits Checker</strong></header><main><h1>Case note</h1><form method="post" action="/casenote/draft?layout=v2"><label for="cn-case">Case reference</label><input id="cn-case" name="case_ref" value="CASE-1003" required><label for="cn-a">GovCalc result</label><input id="cn-a" name="result_a" required><label for="cn-b">Quick Estimator result</label><input id="cn-b" name="result_b" required><label for="cn-c">EntitledTo result</label><input id="cn-c" name="result_c" required><label for="cn-recon">Reconciliation</label><select id="cn-recon" name="reconciliation" data-understudy-zone="reconcile_control"><option value="agree">Calculators agree</option><option value="discrepancy">Discrepancy: needs review</option></select><label for="cn-body">Note</label><textarea id="cn-body" name="note_text" rows="6" cols="60"></textarea><button id="cn-save" type="submit">Save draft</button></form></main></body></html>
