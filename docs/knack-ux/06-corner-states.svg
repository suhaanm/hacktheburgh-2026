<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" role="img" aria-label="The corner pill and card in each state, light and dark">
  <title>Knack corner column states</title>
  <desc>One column in the bottom-right corner of the work area: at most one card above at most one pill. 16 px inset. The pill is 32 px high, 176 to 320 px wide. The card is 340 px wide.</desc>
  <style>
    .t { font-family: "Source Sans 3", "Avenir Next", system-ui, sans-serif; font-size: 13px }
    .s { font-family: "Source Sans 3", "Avenir Next", system-ui, sans-serif; font-size: 12px }
    .h { font-family: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif; font-weight: 600 }
    .m { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 11px }
    .note { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 11px }
  </style>
  <defs>
    <symbol id="g" viewBox="28 30 78 72">
      <circle cx="76" cy="72" r="22" fill="none" stroke="var(--ring)" stroke-width="7"/>
      <circle cx="54" cy="56" r="22" fill="var(--disc)"/>
    </symbol>
    <filter id="sh" x="-10%" y="-30%" width="120%" height="180%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#141922" flood-opacity="0.14"/><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#141922" flood-opacity="0.18"/></filter>
  </defs>
  <rect width="960" height="700" fill="#f4f6f9"/>
  <text class="note" x="24" y="26" fill="#566074">LIGHT: corner column, bottom-right of the work area</text>
  <rect x="480" y="0" width="480" height="700" fill="#0e1319"/>
  <text class="note" x="504" y="26" fill="#9aa6b8">DARK</text>
  <text class="note" x="24" y="60" style="fill:#566074">1 working: glyph, at most 5 words, count when known, Stop</text><g transform="translate(24 68)" filter="url(#sh)"><rect width="292" height="32" rx="16" fill="#fff" stroke="#d8dee8" stroke-width="1"/><use href="#g" x="12" y="8.5" width="15" height="13.8" style="--ring:#0a7c78;--disc:#141922"/><text class="t" x="36" y="20.5" fill="#141922">Filling in calculator B</text><text class="m" x="172" y="20" fill="#566074">3 of 8</text><line x1="222" y1="7" x2="222" y2="25" stroke="#d8dee8"/><rect x="232" y="12" width="8" height="8" fill="#b3261e"/><text class="t" x="246" y="20.5" fill="#141922" font-weight="600">Stop</text></g><text class="note" x="24" y="140" style="fill:#566074">2 needs you: one card over the pill, never a modal</text><g transform="translate(24 150)" filter="url(#sh)"><rect width="340" height="124" rx="6" fill="#fff" stroke="#d8dee8" stroke-width="1"/><text class="s" x="16" y="24" fill="#566074">Knack · your overnight run</text><text class="h" x="16" y="48" font-size="16" fill="#141922">A run is waiting for you</text><text class="t" x="16" y="68" fill="#566074">It could not find the Submit button.</text><text class="t" x="16" y="85" fill="#566074">Review it to point there, or stop it.</text><rect x="16" y="94" width="76" height="22" rx="4" fill="#0a7c78"/><text class="t" x="54.0" y="109" fill="#fff" text-anchor="middle" font-weight="600">Review</text><rect x="100" y="94" width="64" height="22" rx="4" fill="#fff" stroke="#b8c1cf"/><text class="t" x="132.0" y="109" fill="#141922" text-anchor="middle" font-weight="600">Later</text></g><g transform="translate(24 284)" filter="url(#sh)"><rect width="292" height="32" rx="16" fill="#fff" stroke="#d8dee8" stroke-width="1"/><use href="#g" x="12" y="8.5" width="15" height="13.8" style="--ring:#0a7c78;--disc:#141922"/><text class="t" x="36" y="20.5" fill="#141922">Filling in calculator B</text><text class="m" x="172" y="20" fill="#566074">3 of 8</text><line x1="222" y1="7" x2="222" y2="25" stroke="#d8dee8"/><rect x="232" y="12" width="8" height="8" fill="#b3261e"/><text class="t" x="246" y="20.5" fill="#141922" font-weight="600">Stop</text></g><text class="note" x="24" y="352" style="fill:#566074">3 done: 2.5 s, then it fades. The window stays where it was.</text><g transform="translate(24 360)" filter="url(#sh)"><rect width="132" height="32" rx="16" fill="#fff" stroke="#d8dee8" stroke-width="1"/><use href="#g" x="12" y="8.5" width="15" height="13.8" style="--ring:#0a7c78;--disc:#141922"/><path d="M40 17 l4 4 l8 -9" fill="none" stroke="#1a7f45" stroke-width="2"/><text class="t" x="60" y="20.5" fill="#141922">Done</text></g><text class="note" x="24" y="424" style="fill:#566074">4 error: stays until acknowledged, then a menu-bar marker</text><g transform="translate(24 432)" filter="url(#sh)"><rect width="340" height="32" rx="16" fill="#fff" stroke="#b3261e" stroke-width="1.5"/><use href="#g" x="12" y="8.5" width="15" height="13.8" style="--ring:#0a7c78;--disc:#141922"/><text class="t" x="36" y="20.5" fill="#141922">Stopped: could not find Submit</text><line x1="270" y1="7" x2="270" y2="25" stroke="#d8dee8"/><text class="t" x="280" y="20.5" fill="#0a7c78" font-weight="600">Open</text></g><text class="note" x="24" y="496" style="fill:#566074">5 kill: replaces the pill, stays until Resume</text><g transform="translate(24 504)" filter="url(#sh)"><rect width="340" height="92" rx="6" fill="#fff" stroke="#b3261e" stroke-width="1.5"/><rect x="16" y="15" width="9" height="9" fill="#b3261e"/><text class="h" x="34" y="24" font-size="16" fill="#141922">Stopped</text><text class="t" x="16" y="44" fill="#566074">Everything is paused. Nothing runs until you resume.</text><rect x="16" y="62" width="76" height="22" rx="4" fill="#0a7c78"/><text class="t" x="54.0" y="77" fill="#fff" text-anchor="middle" font-weight="600">Resume</text></g><text class="note" x="24" y="624" style="fill:#566074">6 voice (hold Option+Space): same pill, End instead of Stop</text><g transform="translate(24 632)" filter="url(#sh)"><rect width="230" height="32" rx="16" fill="#fff" stroke="#d8dee8" stroke-width="1"/><use href="#g" x="12" y="8.5" width="15" height="13.8" style="--ring:#0a7c78;--disc:#141922"/><text class="t" x="36" y="20.5" fill="#141922">Listening</text><line x1="160" y1="7" x2="160" y2="25" stroke="#d8dee8"/><rect x="170" y="12" width="8" height="8" fill="#b3261e"/><text class="t" x="184" y="20.5" fill="#141922" font-weight="600">End</text></g>
  <text class="note" x="504" y="60" style="fill:#9aa6b8">1 working: glyph, at most 5 words, count when known, Stop</text><g transform="translate(504 68)"><rect width="292" height="32" rx="16" fill="#161d26" stroke="#283341" stroke-width="1"/><use href="#g" x="12" y="8.5" width="15" height="13.8" style="--ring:#4fd1c5;--disc:#e7ebf1"/><text class="t" x="36" y="20.5" fill="#e7ebf1">Filling in calculator B</text><text class="m" x="172" y="20" fill="#9aa6b8">3 of 8</text><line x1="222" y1="7" x2="222" y2="25" stroke="#283341"/><rect x="232" y="12" width="8" height="8" fill="#ff8a80"/><text class="t" x="246" y="20.5" fill="#e7ebf1" font-weight="600">Stop</text></g><text class="note" x="504" y="140" style="fill:#9aa6b8">2 needs you: one card over the pill, never a modal</text><g transform="translate(504 150)"><rect width="340" height="124" rx="6" fill="#161d26" stroke="#283341" stroke-width="1"/><text class="s" x="16" y="24" fill="#9aa6b8">Knack · your overnight run</text><text class="h" x="16" y="48" font-size="16" fill="#e7ebf1">A run is waiting for you</text><text class="t" x="16" y="68" fill="#9aa6b8">It could not find the Submit button.</text><text class="t" x="16" y="85" fill="#9aa6b8">Review it to point there, or stop it.</text><rect x="16" y="94" width="76" height="22" rx="4" fill="#4fd1c5"/><text class="t" x="54.0" y="109" fill="#0e1319" text-anchor="middle" font-weight="600">Review</text><rect x="100" y="94" width="64" height="22" rx="4" fill="#161d26" stroke="#3a4859"/><text class="t" x="132.0" y="109" fill="#e7ebf1" text-anchor="middle" font-weight="600">Later</text></g><g transform="translate(504 284)"><rect width="292" height="32" rx="16" fill="#161d26" stroke="#283341" stroke-width="1"/><use href="#g" x="12" y="8.5" width="15" height="13.8" style="--ring:#4fd1c5;--disc:#e7ebf1"/><text class="t" x="36" y="20.5" fill="#e7ebf1">Filling in calculator B</text><text class="m" x="172" y="20" fill="#9aa6b8">3 of 8</text><line x1="222" y1="7" x2="222" y2="25" stroke="#283341"/><rect x="232" y="12" width="8" height="8" fill="#ff8a80"/><text class="t" x="246" y="20.5" fill="#e7ebf1" font-weight="600">Stop</text></g><text class="note" x="504" y="352" style="fill:#9aa6b8">3 done: 2.5 s, then it fades. The window stays where it was.</text><g transform="translate(504 360)"><rect width="132" height="32" rx="16" fill="#161d26" stroke="#283341" stroke-width="1"/><use href="#g" x="12" y="8.5" width="15" height="13.8" style="--ring:#4fd1c5;--disc:#e7ebf1"/><path d="M40 17 l4 4 l8 -9" fill="none" stroke="#5ad08a" stroke-width="2"/><text class="t" x="60" y="20.5" fill="#e7ebf1">Done</text></g><text class="note" x="504" y="424" style="fill:#9aa6b8">4 error: stays until acknowledged, then a menu-bar marker</text><g transform="translate(504 432)"><rect width="340" height="32" rx="16" fill="#161d26" stroke="#ff8a80" stroke-width="1.5"/><use href="#g" x="12" y="8.5" width="15" height="13.8" style="--ring:#4fd1c5;--disc:#e7ebf1"/><text class="t" x="36" y="20.5" fill="#e7ebf1">Stopped: could not find Submit</text><line x1="270" y1="7" x2="270" y2="25" stroke="#283341"/><text class="t" x="280" y="20.5" fill="#4fd1c5" font-weight="600">Open</text></g><text class="note" x="504" y="496" style="fill:#9aa6b8">5 kill: replaces the pill, stays until Resume</text><g transform="translate(504 504)"><rect width="340" height="92" rx="6" fill="#161d26" stroke="#ff8a80" stroke-width="1.5"/><rect x="16" y="15" width="9" height="9" fill="#ff8a80"/><text class="h" x="34" y="24" font-size="16" fill="#e7ebf1">Stopped</text><text class="t" x="16" y="44" fill="#9aa6b8">Everything is paused. Nothing runs until you resume.</text><rect x="16" y="62" width="76" height="22" rx="4" fill="#4fd1c5"/><text class="t" x="54.0" y="77" fill="#0e1319" text-anchor="middle" font-weight="600">Resume</text></g><text class="note" x="504" y="624" style="fill:#9aa6b8">6 voice (hold Option+Space): same pill, End instead of Stop</text><g transform="translate(504 632)"><rect width="230" height="32" rx="16" fill="#161d26" stroke="#283341" stroke-width="1"/><use href="#g" x="12" y="8.5" width="15" height="13.8" style="--ring:#4fd1c5;--disc:#e7ebf1"/><text class="t" x="36" y="20.5" fill="#e7ebf1">Listening</text><line x1="160" y1="7" x2="160" y2="25" stroke="#283341"/><rect x="170" y="12" width="8" height="8" fill="#ff8a80"/><text class="t" x="184" y="20.5" fill="#e7ebf1" font-weight="600">End</text></g>
</svg>
