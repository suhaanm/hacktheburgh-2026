# Event -> cog mapping for the data-analyst pack. Format and semantics: the engine's
# cogs/default_mapping.yaml. Zones are enums derived by the extension from capture_sites (best-effort
# samples for a thin pack: selectors for real tools are starting points, not guarantees).
version: 1
params: { follow_s: 8, gap_idle_s: 30, reformulate_within_s: 90, max_cog_s: 300 }
extra_cogs: [LOAD_DATA, PROFILE_DATA, WRITE_QUERY, RUN_QUERY, INSPECT_RESULT, PLOT, EXPORT_RESULT]

zones:
  - data_browser
  - profile_panel
  - sql_editor
  - run_control
  - query_result
  - chart_panel
  - export_panel
  - doc
  - form_field
  - search_box
  - query_edit
  - compare_view
  - check_box
  - decision_btn
  - help

rules:
  - { match: { type: [task_start, task_end, progress, stuck, lock, unlock, sleep, resume] }, cog: null }
  - { match: { type: [coach_shown, coach_followed, coach_dismissed, agent_step, approval] }, cog: null }
  # ---- data-analyst role cogs
  - { match: { type: [nav, click, focus], zone: data_browser }, cog: LOAD_DATA }
  - { match: { type: [click, focus, scroll], zone: profile_panel }, cog: PROFILE_DATA }
  - { match: { type: [click, focus], zone: sql_editor }, cog: WRITE_QUERY }
  - { match: { type: click, zone: run_control }, cog: RUN_QUERY }
  - { match: { type: [scroll, focus, click], zone: query_result }, cog: INSPECT_RESULT }
  - { match: { type: [click, focus], zone: chart_panel }, cog: PLOT }
  - { match: { type: click, zone: export_panel }, cog: EXPORT_RESULT }
  # ---- base cogs
  - { match: { type: idle }, cog: IDLE, backdate_meta: idle_s }
  - { match: { type: undo }, cog: REVERT }
  - { match: { type: [focus, click], zone: query_edit }, cog: REFORMULATE }
  - { match: { type: [scroll, focus, click], zone: search_box }, cog: SEARCH }
  - { match: { type: search }, cog: SEARCH, reformulate_as: REFORMULATE }
  - { match: { type: [tab, click], zone: compare_view }, cog: COMPARE }
  - { match: { type: click, zone: check_box }, cog: CHECK }
  - { match: { type: click, zone: decision_btn }, cog: DECIDE }
  - { match: { type: click, zone: help }, cog: ASK }
  - { match: { type: [click, focus], zone: form_field }, cog: ENTER }
  - { match: { type: focus, zone: doc }, cog: READ, starts: true }
  - { match: { type: scroll, zone: doc }, cog: READ }
  - { match: { type: copy }, cog: COPY }
  - { match: { type: paste }, cog: PASTE }
  - { match: { type: [nav, tab] }, cog: NAVIGATE }
  - { match: { type: click, role: [link, tab, menuitem] }, cog: NAVIGATE }   # zoneless link clicks navigate
  - { match: { type: click }, cog: ENTER }
  - { match: { type: [scroll, focus] }, cog: READ }

capture_sites:
  - id: warehouse
    hosts: ["*.snowflakecomputing.com", "console.cloud.google.com", "*.databricks.com"]
    nav_default: data_browser
    tab_default: compare_view
    elements:
      - { zone: sql_editor, selector: '.monaco-editor, [role="textbox"][aria-label], .cm-editor' }
      - { zone: run_control, selector: 'button[data-testid*="run"], button[aria-label*="Run"]' }
      - { zone: query_result, selector: '[role="grid"], [role="table"], .results' }
  - id: notebook
    hosts: ["colab.research.google.com", "app.hex.tech", "localhost:8888"]
    nav_default: data_browser
    tab_default: compare_view
    elements:
      - { zone: sql_editor, selector: ".cm-editor, .monaco-editor, .CodeMirror" }
      - { zone: run_control, selector: 'button[aria-label*="Run"], .run-button' }
      - { zone: query_result, selector: ".output_area, .jp-OutputArea, [role=\"table\"]" }
      - { zone: chart_panel, selector: "canvas, svg.plot, .output_png" }
  - id: sheet
    hosts: ["docs.google.com"]
    nav_default: doc
    tab_default: compare_view
    elements:
      - { zone: chart_panel, selector: '[aria-label*="Chart"], .chart-container' }
  - id: bi
    hosts: ["*.looker.com", "app.powerbi.com", "*.tableau.com"]
    nav_default: doc
    tab_default: compare_view
    elements:
      - { zone: chart_panel, selector: 'svg, canvas, [data-testid*="chart"]' }
      - { zone: export_panel, selector: 'button[aria-label*="Export"], button[aria-label*="Download"]' }

examples:
  - name: write, run and inspect a query
    events:
      - { dt: 0,  type: focus,  role: textbox, meta: { zone: sql_editor } }
      - { dt: 40, type: click,  role: button,  meta: { zone: run_control } }
      - { dt: 5,  type: scroll, meta: { zone: query_result, depth_bin: 1 } }
      - { dt: 15, type: copy }
      - { dt: 4,  type: click,  role: button,  meta: { zone: chart_panel } }
    expect: [WRITE_QUERY, RUN_QUERY, INSPECT_RESULT, COPY, PLOT]
