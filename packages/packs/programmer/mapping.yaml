# Thin-pack mapping for the programmer. Semantics: packages/schema/pack.schema.json#/$defs/mapping.
version: 1

segmentation: { merge_gap_s: 6, idle_s: 45, max_dwell_s: 90 }

domain_roles:
  git_host: { label: "Git host", hosts: ["github.com", "gitlab.com", "bitbucket.org"] }
  ci:       { label: "CI dashboard", hosts: ["*.circleci.com", "buildkite.com", "localhost:8080"] }
  tracker:  { label: "Issue tracker", hosts: ["*.atlassian.net", "linear.app"] }
  docs:     { label: "Library docs", hosts: ["docs.python.org", "developer.mozilla.org", "stackoverflow.com", "*.readthedocs.io"] }

label_roles:
  code_view:  { vocab: ["code", "blob", "source", "view file", "raw"] }
  editor:     { vocab: ["edit file", "edit this file", "code editor", "editor"] }
  diff:       { vocab: ["files changed", "diff", "review changes", "changes"] }
  trace:      { vocab: ["logs", "build log", "stack trace", "failed", "details", "view raw logs"] }
  run_tests:  { vocab: ["re-run", "rerun", "re-run failed jobs", "run workflow", "run tests"] }
  commit:     { vocab: ["commit changes", "commit"] }
  ask_help:   { vocab: ["ask for help", "message team"] }
  verify:     { vocab: ["checks", "summary", "status"] }

role_rules:
  - { id: run_tests, when: { type: click, domain_role: [ci, git_host], label_role: run_tests }, cog: RUN_TESTS }
  - { id: commit, when: { type: click, domain_role: git_host, label_role: commit }, cog: COMMIT }
  - { id: edit_code, when: { type: [focus, click], domain_role: git_host, label_role: editor }, cog: EDIT_CODE }
  - { id: review_diff, when: { type: [scroll, click, focus], domain_role: git_host, label_role: diff }, cog: REVIEW_DIFF }
  - { id: read_trace_label, when: { type: [scroll, click, focus], domain_role: ci, label_role: trace }, cog: READ_TRACE }
  - { id: read_trace_scroll, when: { type: scroll, domain_role: ci }, cog: READ_TRACE }
  - { id: read_code_label, when: { type: [scroll, click, focus], domain_role: git_host, label_role: code_view }, cog: READ_CODE }
  - { id: read_code_scroll, when: { type: scroll, domain_role: git_host }, cog: READ_CODE }
  - { id: search_docs_nav, when: { type: [nav, tab, search], domain_role: docs }, cog: SEARCH_DOCS }
  - { id: search_docs_scroll, when: { type: scroll, domain_role: docs }, cog: SEARCH_DOCS }

base_rules:
  - { id: ignore_markers, when: { type: [stuck, coach_shown, coach_followed, coach_dismissed, agent_step, progress, task_start, task_end, unlock, resume] }, ignore: true }
  - { id: idle_signals, when: { type: [idle, lock, sleep] }, cog: IDLE }
  - { id: ask_for_help, when: { type: [click, focus], label_role: ask_help }, cog: ASK }
  - { id: verify, when: { type: [click, focus, scroll], label_role: verify }, cog: CHECK }
  - { id: search_follow_up, when: { type: search, prev_cog: [SEARCH, REFORMULATE], within_s: 90 }, cog: REFORMULATE }
  - { id: search_first, when: { type: search }, cog: SEARCH }
  - { id: undo, when: { type: undo }, cog: REVERT }
  - { id: human_decision, when: { type: approval, actor: human }, cog: DECIDE }
  - { id: ignore_agent_approval, when: { type: approval }, ignore: true }
  - { id: copy, when: { type: copy }, cog: COPY }
  - { id: paste, when: { type: paste }, cog: PASTE }
  - { id: compare_tab_flip, when: { type: tab, prev_type: tab, within_s: 12 }, cog: COMPARE }
  - { id: navigate_nav, when: { type: [nav, tab] }, cog: NAVIGATE }
  - { id: read_scroll, when: { type: scroll }, cog: READ }
  - { id: read_text_click, when: { type: click, target_role: [heading, text, paragraph, cell, row, img, article] }, cog: READ }
  - { id: enter_field, when: { type: [click, focus], target_role: [textbox, spinbutton, combobox, searchbox, radio, checkbox, slider, textarea] }, cog: ENTER }
  - { id: navigate_click, when: { type: [click, focus] }, cog: NAVIGATE }

examples:
  - name: failing build, read the trace, re-run
    hash_roles:
      domain: { ci: ["d:e001"], git_host: ["d:e002"] }
      label:  { trace: ["h:2001"], run_tests: ["h:2002"] }
    events:
      - { dt: 0,  type: nav,    target: { domain_hash: "d:e001" } }
      - { dt: 5,  type: click,  target: { role: link, label_hash: "h:2001", domain_hash: "d:e001" } }
      - { dt: 20, type: scroll, target: { domain_hash: "d:e001" } }
      - { dt: 30, type: click,  target: { role: button, label_hash: "h:2002", domain_hash: "d:e001" } }
    expect: [NAVIGATE, READ_TRACE, READ_TRACE, RUN_TESTS]
