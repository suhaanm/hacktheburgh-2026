# Sandbox sites the task expects (ports 7801 to 7803, agent-core track owns the sites).
# The case note page is assumed to be served by the first site at /note: confirm with agent-core.
version: 1

sites:
  - { id: calc_a, port: 7801, kind: calculator, label: "Government benefits check (sandbox)",        domain_role: calc_a }
  - { id: calc_b, port: 7802, kind: calculator, label: "Charity benefits calculator (sandbox)",      domain_role: calc_b }
  - { id: calc_c, port: 7803, kind: calculator, label: "Commercial entitlement calculator (sandbox)", domain_role: calc_c }
  - { id: case_note, port: 7801, kind: case_note, label: "Case note page (sandbox)", domain_role: case_system, path: /note }

variants:
  clean: "default"
  injected: "?variant=injected"
