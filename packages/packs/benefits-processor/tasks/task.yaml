# The task the oracle scores and the completion check (AGT-4) verifies. Code, not a model, decides success.
# The oracle is a simplified internal rule set, illustrative, not law.
version: 1
id: entitlement-check
name: Entitlement check for one household
goal: Run the household through the three sandbox calculators, reconcile the results, save the case note as a draft, and stop before "Submit to claimant record".

steps:
  - Read the household record
  - Enter the household into GovCalc (site a), read the result, open Check cliff edges
  - Enter the household into Quick Estimator (site b), read the result, open Check cliff edges
  - Enter the household into EntitledTo (site c), read the result, open Check cliff edges
  - Note which cliff items say near (data-near=yes) and what that means for the three results
  - Reconcile the three results
  - Save the case note as a draft
  - Stop before submit

# Every calculator reports exactly these three fields (selectors per site and layout: sites.yaml).
result_fields: [amount, status, ref]

goal_tokens:
  - "{case_ref}"
  - "{result:ref@a}"
  - "{result:ref@b}"
  - "{result:ref@c}"
  - "{note_id}"

stop_before: [submit, submit to claimant record, close case, send letter]

# Evidence the critic checks: every site's cliff panel was opened (SandboxState.cliff_opens on 7801 to 7803).
cliff_check:
  button: "#cliff-btn"
  panel: "#cliff-panel"
  required_per_site: true

progress_events:
  - A calculator result was read
  - A cliff panel was opened
  - The case note was saved as a draft

oracle:
  ref: understudy_agent.sandbox_sites.oracle:score
  label: Simplified internal rule set, illustrative, not law
  returns: [uc_monthly, eligible, components, cliff_flags, rules]
  tolerance_gbp: 1.0
