# Event -> cog mapping for the benefits pack. Same format as
# services/engine/understudy_engine/cogs/default_mapping.yaml (the source of truth for semantics).
# Events carry no text; the only semantic hint is meta.zone, an enum naming the page region.
# The extension derives zones from the capture config on each site in tasks/sites.yaml.
# params and rules are a verbatim copy of the engine default; `uv run python packages/packs/sync_mapping.py`
# re-syncs them and a test fails when they drift. `starts: true` opens a new segment even when the previous
# one has the same cog.
version: 1
params:
  follow_s: 6                  # a cog keeps going this long after its last event
  gap_idle_s: 20               # a longer silence between two cogs becomes an IDLE cog
  reformulate_within_s: 90
  max_cog_s: 300               # cap on one segment's dwell
extra_cogs: [ENTER_HOUSEHOLD, OPEN_CALCULATOR, READ_RESULT, CHECK_CLIFF, COPY_TO_NOTE, RECONCILE]

# Zone vocabulary of this pack: benefits role zones first, then the base zones.
zones:
  - calc_site
  - household_form
  - calc_result
  - cliff_button
  - cliff_panel
  - case_note
  - results_tabs
  - doc
  - form_field
  - search_box
  - query_edit
  - compare_view
  - check_box
  - decision_btn
  - help

rules:
  # ---- not cogs
  - { match: { type: [task_start, task_end, progress, stuck, lock, unlock, sleep, resume] }, cog: null }
  - { match: { type: [coach_shown, coach_followed, coach_dismissed, agent_step, approval] }, cog: null }
  # ---- benefits-processor role cogs
  - { match: { type: nav, zone: calc_site }, cog: OPEN_CALCULATOR }
  - { match: { type: [click, focus, scroll], zone: household_form }, cog: ENTER_HOUSEHOLD }
  - { match: { type: focus, zone: calc_result }, cog: READ_RESULT, starts: true }
  - { match: { type: scroll, zone: calc_result }, cog: READ_RESULT }
  - { match: { type: click, zone: cliff_button }, cog: CHECK_CLIFF, starts: true }   # the "check cliff edges" button
  - { match: { type: focus, zone: cliff_panel }, cog: CHECK_CLIFF, starts: true }
  - { match: { type: [click, scroll], zone: cliff_panel }, cog: CHECK_CLIFF }
  - { match: { type: copy, zone: calc_result }, cog: COPY_TO_NOTE }
  - { match: { type: [tab, paste, click, focus], zone: case_note }, cog: COPY_TO_NOTE }
  - { match: { type: [tab, click], zone: results_tabs }, cog: RECONCILE }
  # ---- base cogs
  - { match: { type: idle }, cog: IDLE, backdate_meta: idle_s }
  - { match: { type: undo }, cog: REVERT }
  - { match: { type: [focus, click], zone: query_edit }, cog: REFORMULATE }
  - { match: { type: [scroll, focus, click], zone: search_box }, cog: SEARCH }
  - { match: { type: search }, cog: SEARCH, reformulate_as: REFORMULATE }
  - { match: { type: [tab, click], zone: compare_view }, cog: COMPARE }
  - { match: { type: click, zone: check_box }, cog: CHECK }
  - { match: { type: click, zone: decision_btn }, cog: DECIDE }
  - { match: { type: click, zone: help }, cog: ASK }
  - { match: { type: [click, focus], zone: form_field }, cog: ENTER }
  - { match: { type: focus, zone: doc }, cog: READ, starts: true }
  - { match: { type: scroll, zone: doc }, cog: READ }
  - { match: { type: copy }, cog: COPY }
  - { match: { type: paste }, cog: PASTE }
  - { match: { type: [nav, tab] }, cog: NAVIGATE }
  - { match: { type: click, role: [link, tab, menuitem] }, cog: NAVIGATE }   # zoneless link clicks navigate
  - { match: { type: click }, cog: ENTER }
  - { match: { type: [scroll, focus] }, cog: READ }

examples:
  - name: one calculator pass (open, enter, read)
    events:
      - { dt: 0,  type: nav,    meta: { zone: calc_site } }
      - { dt: 4,  type: focus,  role: textbox, meta: { zone: household_form } }
      - { dt: 6,  type: click,  role: button,  meta: { zone: household_form } }
      - { dt: 3,  type: nav,    meta: { zone: calc_result } }
      - { dt: 3,  type: scroll, meta: { zone: calc_result, depth_bin: 2 } }
    expect: [OPEN_CALCULATOR, ENTER_HOUSEHOLD, ENTER_HOUSEHOLD, NAVIGATE, READ_RESULT]
  - name: compare results across tabs, copy a result into the case note
    events:
      - { dt: 0,  type: tab,    role: tab, meta: { zone: results_tabs } }
      - { dt: 4,  type: tab,    role: tab, meta: { zone: results_tabs } }
      - { dt: 15, type: copy,   role: region, meta: { zone: calc_result } }
      - { dt: 5,  type: tab,    role: tab, meta: { zone: case_note } }
      - { dt: 3,  type: paste,  role: textbox, meta: { zone: case_note } }
      - { dt: 2,  type: progress, meta: { kind: note_field } }
    expect: [RECONCILE, RECONCILE, COPY_TO_NOTE, COPY_TO_NOTE, COPY_TO_NOTE, null]
  - name: open the cliff panel and read it
    events:
      - { dt: 0,  type: click,  role: button, meta: { zone: cliff_button } }
      - { dt: 4,  type: scroll, role: region, meta: { zone: cliff_panel, depth_bin: 1 } }
      - { dt: 3,  type: focus,  role: region, meta: { zone: cliff_panel } }
    expect: [CHECK_CLIFF, CHECK_CLIFF, CHECK_CLIFF]
  - name: base cogs outside any calculator
    events:
      - { dt: 0,  type: search, role: searchbox, meta: { zone: search_box, len: 14 } }
      - { dt: 12, type: search, role: searchbox, meta: { zone: search_box, len: 18 } }
      - { dt: 40, type: click,  role: link }
      - { dt: 7,  type: undo }
      - { dt: 90, type: idle, source: os, meta: { idle_s: 90 } }
      - { dt: 2,  type: click,  role: button }
    expect: [SEARCH, REFORMULATE, NAVIGATE, REVERT, IDLE, ENTER]
